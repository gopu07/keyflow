<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Vertical spine of the K -->
  <rect x="55" y="40" width="18" height="120" rx="9" fill="url(#flowGrad)"/>

  <!-- Upper flowing stroke of the K, drawn as a smooth ribbon instead of a straight diagonal -->
  <path d="M 73 100
           C 100 90, 110 60, 145 45
           C 152 42, 158 46, 155 53
           C 130 68, 118 88, 95 103
           C 88 107, 78 106, 73 100 Z"
        fill="url(#flowGrad)"/>

  <!-- Lower flowing stroke of the K, mirrored, suggesting motion/speed trailing off -->
  <path d="M 73 100
           C 100 110, 112 138, 148 158
           C 156 162, 152 170, 143 167
           C 115 155, 100 132, 76 115
           C 70 111, 69 104, 73 100 Z"
        fill="url(#flowGrad)"/>

  <!-- Small speed accent lines trailing the upper stroke, reinforcing "flow" -->
  <path d="M 148 42 C 158 39, 168 41, 174 46" stroke="#93C5FD" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 152 158 C 162 163, 170 163, 176 160" stroke="#93C5FD" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
